{% extends 'base.html' %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        {% if article.image %}
        <img src="{{ article.image.url }}" class="card-img-top" alt="{{ article.title }}" style="max-height: 400px; object-fit: cover;">
        {% endif %}
        <div class="card-body">
            <h1 class="card-title">{{ article.title }}</h1>
            <p class="text-muted">{{ article.created_at|date:"d.m.Y" }}</p>
            <div class="card-text">
                {{ article.content|linebreaks }}
            </div>
            <a href="{% url 'news' %}" class="btn btn-primary">← Назад к новостям</a>
        </div>
    </div>
</div>
{% endblock %}
